server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: msvc-student
          uri: lb://MSVC-STUDENT
          predicates:
            - Path=/api/students/**

        - id: msvc-course
          uri: lb://MSVC-COURSE
          predicates:
            - Path=/api/courses/**

        - id: msvc-enrollment
          uri: lb://MSVC-ENROLLMENT
          predicates:
              - Path=/api/enrollments/**