# Los Tests de Integración (Data) usarán H2 en memoria
spring:
  application:
    name: microservice-enrollment

  datasource:
    url: jdbc:h2:mem:enrollmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa # System Administrator
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Ignora el import.sql para los tests
        hbm2ddl:
          import_files: ""

# Desactiva la conexión con Config Server en la suite de integración
spring.cloud.config.enabled: false